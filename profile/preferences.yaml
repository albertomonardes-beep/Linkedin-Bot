# Títulos de cargo a buscar (se usan como keywords en los portales)
# Se incluyen variantes de escritura porque cada portal es distinto
job_titles:
  - "Gerente de Operaciones"
  - "Gerente de Logística"
  - "Gerente de Supply Chain"
  - "Gerente de Producción"
  - "Gerente de Manufactura"
  - "Subgerente de Operaciones"
  - "Subgerente de Logística"
  - "Subgerente de Supply Chain"
  - "Subgerente de Producción"
  - "Subgerente de Manufactura"
  - "Sub Gerente de Operaciones"
  - "Sub Gerente de Logística"
  - "Sub Gerente de Supply Chain"
  - "Sub Gerente de Producción"
  - "Sub Gerente de Manufactura"
  - "Sub-Gerente de Operaciones"
  - "Sub-Gerente de Logística"
  - "Sub-Gerente de Supply Chain"
  - "Sub-Gerente de Producción"
  - "Sub-Gerente de Manufactura"

# Keywords adicionales para afinar el scoring de la IA
keywords:
  - "Supply Chain"
  - "Logística"
  - "Operaciones"
  - "Manufactura"
  - "Producción"
  - "Lean"
  - "Mejora continua"
  - "Seis Sigma"
  - "WMS"
  - "SAP"
  - "Consumo masivo"

# Ubicaciones aceptadas
locations:
  - "Santiago"
  - "Remoto"

# Keywords que descartan automáticamente un aviso (sin usar API)
exclude_keywords:
  - "junior"
  - "trainee"
  - "practicante"
  - "intern"
  - "pasantía"
  - "asistente"
  - "analista"
  - "coordinador"
  - "auxiliar"
  - "operario"
  - "técnico"

# Puntaje mínimo para recibir notificación (1-10)
relevance_threshold: 7

# Máximo de avisos nuevos a procesar por ejecución (limita costo de API)
max_jobs_per_run: 50

# Páginas a revisar por portal por cada combinación keyword+ubicación
max_pages_per_portal: 3

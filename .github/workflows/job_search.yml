name: Job Search Bot
# v2
on:
  schedule:
    # Runs every 3 hours during Chilean business hours (Mon–Fri, 08:00–20:00 CLT = 11:00–23:00 UTC)
    - cron: "0 11,14,17,20,23 * * 1-5"
  workflow_dispatch: # Allow manual runs

permissions:
  contents: write # Needed for the commit-back step

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ----------------------------------------------------------------
      # 1. Checkout
      # ----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      # ----------------------------------------------------------------
      # 2. Python setup
      # ----------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ----------------------------------------------------------------
      # 3. Playwright Chromium (cached)
      # ----------------------------------------------------------------
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium --with-deps

      - name: Install Playwright system dependencies (if cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      # ----------------------------------------------------------------
      # 4. Run the bot
      # ----------------------------------------------------------------
      - name: Run job search bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINKEDIN_EMAIL: ${{ secrets.LINKEDIN_EMAIL }}
          LINKEDIN_PASSWORD: ${{ secrets.LINKEDIN_PASSWORD }}
        run: python main.py

      # ----------------------------------------------------------------
      # 5. Commit seen_jobs.json back to the repo
      # ----------------------------------------------------------------
      - name: Commit seen_jobs.json
        run: |
          git config user.name "job-bot[bot]"
          git config user.email "job-bot@users.noreply.github.com"
          git add seen_jobs.json
          # Only commit if there are actual changes
          git diff --cached --quiet || git commit -m "chore: update seen_jobs.json [skip ci]"
          git pull --rebase origin master
          git push
